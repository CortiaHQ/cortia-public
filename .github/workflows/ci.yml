name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests when tests directory exists
        run: |
          if [ -d "tests" ]; then
            python -m pytest
          else
            echo "No tests/ directory found; exiting successfully."
          fi