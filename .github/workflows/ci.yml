name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: pip install pytest
      - name: Run tests if present
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No tests/ directory found; skipping pytest."
          fi